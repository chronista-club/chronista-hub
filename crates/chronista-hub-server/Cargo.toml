[package]
name = "chronista-hub-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chronista Hub server — World Tree meta-registry (axum + embedded SurrealDB)"

[[bin]]
name = "chronista-hub-server"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
surrealdb.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
rand.workspace = true
sha2.workspace = true
subtle.workspace = true
# 次世代通信基盤 (QUIC + KDL discovery)。 world registry/discovery channel を提供。
club-unison = { workspace = true }
# quinn 用 rustls provider を main.rs で明示 install する (aws-lc-rs/ring が両方 graph に
# 入り auto-detect 不能 → ring を default 指定)。
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
