name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust (fmt / clippy / build / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SurrealKV の旧 RocksDB 互換ライブラリの bindgen は libclang を、
      # club-unison の build script (buffa/protobuf) は protoc を要求する。
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y clang protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test --locked --workspace

      - name: SurrealDB 3.3.4 / 4.0.0 compatibility
        run: bash scripts/test-db-compat.sh

      - name: Embedded process restart persistence
        run: bash scripts/e2e.sh
