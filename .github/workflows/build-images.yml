# chronista-hub-server の container image を build → GHCR へ push。
#
# image は **stage 非依存** (`chronista-hub-server`)。 binary は stage を実行時
# env でしか区別しないので、 scratch/live で同一 image を使い回す (.container 側で
# .env を切替)。 platforms=linux/amd64 (deploy 先 fleet-worker-01 が x86_64)。
#
# - PR: build のみ (push せず Dockerfile の breakage を検知)
# - push to main: build + push (:latest + :<sha>)

name: Build Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/smoke-image.sh"
      - "crates/**"
      - "migrations/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "scripts/smoke-image.sh"
      - "crates/**"
      - "migrations/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/chronista-hub-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_PR_HEAD_SHA: "true"
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Release image persistence smoke
        env:
          IMAGE_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash scripts/smoke-image.sh "$IMAGE_TAG"

      - name: Save candidate image
        if: github.event_name == 'pull_request'
        env:
          IMAGE_TAG: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          mkdir -p image-artifact
          docker image inspect "$IMAGE_TAG" > image-artifact/image-inspect.json
          docker save "$IMAGE_TAG" | gzip > image-artifact/chronista-hub-linux-amd64.tar.gz
          cd image-artifact
          sha256sum chronista-hub-linux-amd64.tar.gz > SHA256SUMS

      - name: Upload candidate image
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: chronista-hub-linux-amd64-${{ github.event.pull_request.head.sha }}
          path: image-artifact/
          compression-level: 0
          retention-days: 14
