# Chronista Hub — cargo workspace (server。 将来 Rust client SDK も crates/ に)
# bun workspace (packages/* = KDL codegen pipeline) と共存する polyglot monorepo。
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
surrealdb = { version = "3.0", features = ["kv-rocksdb", "kv-mem"] }
# JWT 検証 (RS256、 内部で ring を使う — TLS の aws-lc-rs とは別用途で競合しない)
jsonwebtoken = "9"
# product-token: 乱数生成 + SHA-256 hash (opaque token、 ADR-010 Phase 2)
rand = "0.9"
sha2 = "0.10"
# 定数時間比較 (admin key 照合)
subtle = "2"
# JWKS fetch 専用 (起動時 1 回)。 TLS は aws-lc-rs (surrealdb と provider 一致)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 次世代通信基盤 (QUIC + KDL discovery)。 package = club-unison、 lib identifier = `unison`。
# node↔hub discovery を Unison channel で行う (crates.io 公開、 ADR-018)。
# 1.2.0: spawn_listen_with_cert (federation cert gap)、 1.3.0: raw QUIC ALPN "unison"、
# 1.4.0: connection-level auth primitive (enable_auth、 ADR-020 §S3)、
# 1.5.0: server-initiated reliable stream (ctx.open_server_stream / register_server_channel、
#        ServerToClient を起こす — relay = universal floor の土台、 ADR-020 §S4)、
# 1.6.0: connect_race (Happy Eyeballs v2 staggered-race dialer、 ADR-020 §S6)、
# 1.7.0: QUIC accept loop の片肺死 fix — accept 内の handshake await 失敗が loop 全体を
#        殺していた (hub は常駐 QUIC server なのでこれが効く)、
# 1.8.0: KDL request の safety hint 属性 (readonly / destructive / idempotent)、
# 1.9.0: buffa 0.5.2 → 0.9.1 で **受信経路の脆弱性 2 件を解消** (UAF: GHSA-9pwq-gcrx-wghh、
#        unbounded allocation DoS: CVE-2026-55407)。 全 ProtocolMessage の decode に効く。
#        buffa 0.5 系に patch 版が無く下流の cargo update では直せないため、 下限を
#        1.9.0 に固定する (1.5 のままだと脆弱な graph に解決し戻れてしまう)。
# 2.0.0: 呼び出し元の無い public API の一掃 (major)。 **wire bytes は不変** なので 1.x の
#        client (VP 等) とそのまま通信できる。 hub 側の移行は listen 系 5 メソッド →
#        `Arc<ProtocolServer>::listener(addr).cert(..).spawn()` builder と、
#        `ProtocolClient::new_default` → `insecure_localhost` (examples) のみ。
club-unison = "2.0.0"
